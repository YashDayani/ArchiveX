name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Check the bundle has no third-party code
        run: |
          lipo -archs build/ArchiveX.app/Contents/MacOS/ArchiveX
          find build/ArchiveX.app -type f
          # every linked library must be an Apple system library (otool prints one header line per architecture)
          if otool -L build/ArchiveX.app/Contents/MacOS/ArchiveX | grep -v -E '^build/' | awk '{print $1}' | grep -v -E '^/(System|usr/lib)/'; then
            echo "non-system library linked"; exit 1
          fi
          echo "only system libraries are linked"
      - name: Check the release scripts
        run: |
          sh -n scripts/setup-update-signing.sh
          swiftc -typecheck scripts/generate_update_key.swift
          swiftc -typecheck scripts/sign_update.swift
