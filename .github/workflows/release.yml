name: Release

# Builds ArchiveX from source when a version tag is pushed, then publishes a GitHub release with the zipped app,
# SHA-256 checksums and a build-provenance attestation (so anyone can verify the zip came from this repository).
#
# If the repository has an Apple Developer ID configured (the secrets listed below), the app is also signed with it and
# notarized by Apple, so macOS opens it without a warning. Without those secrets the app is ad-hoc signed.
#   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID     Apple ID email and Team ID used for notarization
#   APPLE_APP_PASSWORD          an app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the release
  id-token: write        # sign the attestation
  attestations: write    # store the attestation

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build universal app
        env:
          VERSION_TAG: ${{ github.ref_name }}
          ARCHIVEX_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          ARCHIVEX_VERSION="${VERSION_TAG#v}" ./build.sh
          lipo -archs build/ArchiveX.app/Contents/MacOS/ArchiveX

      - name: Notarize with Apple
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/ArchiveX.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/ArchiveX.app
          spctl --assess --type execute --verbose build/ArchiveX.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/ArchiveX.app ArchiveX.zip
          shasum -a 256 ArchiveX.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ArchiveX.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" ArchiveX.zip SHA256SUMS \
            --title "ArchiveX $TAG" --generate-notes
